syntax = "proto3";

// Rebuilt from Spotify's generated classes by scripts/port/protos.py; enums are int32.
package spotify.your_library.esperanto.proto;
import "spotify.your_library.proto.proto";

message CuratedItems {
  repeated string items = 1;
  int32 filter = 2;
}

message IsCuratedItem {
  string uri = 1;
  bool is_curated = 2;
  bool is_in_collection = 3;
  bool is_banned = 4;
}

message IsCuratedRequest {
  int32 update_throttling = 1;
  repeated string uri = 2;
  string context_uri = 3;
  int32 filter = 4;
}

message IsCuratedResponse {
  repeated IsCuratedItem item = 1;
  uint32 status_code = 98;
  string error = 99;
}

message PinRequest {
  string uri = 1;
  oneof position {
    string after_uri = 2;
    string before_uri = 3;
    bool first = 4;
  }
}

message PinResponse {
  int32 status = 1;
  bool has_maximum_pinned_items = 2;
  int32 maximum_pinned_items = 3;
  uint32 status_code = 98;
  string error = 99;
}

message TransferProgress {
  string transfer_id = 1;
  int32 status = 2;
  float progress = 3;
  int32 items_moved = 4;
  int32 items_total = 5;
}

message TransferProgressRequest {
}

message TransferProgressResponse {
  TransferProgress transfer_progress = 1;
  uint32 status_code = 98;
  string error = 99;
}

message YourLibraryContainsRequest {
  repeated string requested_uri = 3;
  .spotify.your_library.proto.YourLibraryPredefinedPlaylistConfigs predefined_playlist_configs = 4;
  int32 update_throttling = 5;
}

message YourLibraryContainsResponse {
  YourLibraryContainsResponseHeader header = 1;
  repeated YourLibraryContainsResponseEntity entity = 2;
  uint32 status_code = 98;
  string error = 99;
}

message YourLibraryContainsResponseEntity {
  string uri = 1;
  bool is_in_library = 2;
}

message YourLibraryContainsResponseHeader {
  bool is_loading = 2;
}

message YourLibraryDecorateRequest {
  repeated string requested_uri = 3;
  .spotify.your_library.proto.YourLibraryPredefinedPlaylistConfigs predefined_playlist_configs = 6;
  int32 update_throttling = 7;
}

message YourLibraryDecorateResponse {
  YourLibraryDecorateResponseHeader header = 1;
  repeated .spotify.your_library.proto.YourLibraryDecoratedEntity entity = 2;
  uint32 status_code = 98;
  string error = 99;
}

message YourLibraryDecorateResponseHeader {
  bool is_loading = 2;
}

message YourLibraryRequest {
  YourLibraryRequestHeader header = 1;
  .spotify.your_library.proto.YourLibraryPredefinedPlaylistConfigs predefined_playlist_configs = 4;
  int32 update_throttling = 5;
}

message YourLibraryRequestHeader {
  bool remaining_entities = 9;
  string lower_bound = 10;
  int32 skip = 11;
  int32 length = 12;
  string text_filter = 13;
  .spotify.your_library.proto.YourLibraryFilters filters = 14;
  .spotify.your_library.proto.YourLibrarySortOrder sort_order = 15;
  bool all_playlists = 17;
  bool total_count = 18;
  bool separate_pinned_items = 22;
  bool num_link_types_in_playlists = 25;
  bool ignore_pinning = 26;
  CuratedItems curated_items = 29;
  bool include_events = 30;
  bool include_prereleases = 31;
  bool include_authors = 33;
  repeated int64 fill_folders = 34;
  bool include_venues = 35;
  bool include_concert_campaigns = 36;
  string upper_bound = 37;
  oneof maybeFolderId {
    int64 folder_id = 16;
  }
  oneof maybeTagFilter {
    YourLibraryTagFilter tag_filter = 24;
  }
}

message YourLibraryResponse {
  YourLibraryResponseHeader header = 1;
  repeated .spotify.your_library.proto.YourLibraryDecoratedEntity entity = 2;
  repeated .spotify.your_library.proto.YourLibraryDecoratedEntity pinned_entity = 3;
  int32 status_code = 98;
  string error = 99;
}

message YourLibraryResponseHeader {
  int32 remaining_entities = 9;
  bool is_loading = 12;
  string folder_name = 15;
  .spotify.your_library.proto.YourLibraryFilters available_filters = 16;
  int32 total_count = 17;
  int32 pin_count = 18;
  int32 maximum_pinned_items = 19;
  string parent_folder_uri = 20;
  YourLibraryTagInfo tag_info = 21;
  .spotify.your_library.proto.YourLibraryFilters2 available_filters_2 = 22;
}

message YourLibraryTagFilter {
  string tag_uri = 1;
}

message YourLibraryTagInfo {
  string tag_name = 1;
}
