syntax = "proto3";

// Rebuilt from Spotify's generated classes by scripts/port/protos.py; enums are int32.
package com.google.protobuf;

message Any {
  string type_url = 1;
  bytes value = 2;
}

message BoolValue {
  bool value = 1;
}

message BytesValue {
  bytes value = 1;
}

message DoubleValue {
  double value = 1;
}

message Duration {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Empty {
}

message FieldMask {
  repeated string paths = 1;
}

message Int32Value {
  int32 value = 1;
}

message Int64Value {
  int64 value = 1;
}

message StringValue {
  string value = 1;
}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}
