[package]
name = "spatch_app"
version = "0.2.0"
edition = "2021"
description = "Spatch's Rust bridge to Spotify's core"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
preview = []

[dependencies]
jni = "0.21"
log = "0.4"
prost = "0.14"

# On-phone lyric generation (experimental): speech recognition over the song's own audio.
[target.'cfg(target_os = "android")'.dependencies]
whisper-rs = "0.16"

[build-dependencies]
prost-build = "0.14"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
