[package]
name = "spatch_app"
version = "0.1.0"
edition = "2024"
description = "Spatch's own Spotify UI: Rust and Slint over Spotify's core, inside the patched app"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
log = "0.4"
prost = "0.14"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
ndk-sys = "0.6"

[build-dependencies]
prost-build = "0.14"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
