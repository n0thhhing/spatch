[package]
name = "spatch_app"
version = "0.2.0"
edition = "2021"
description = "Spatch's Rust bridge to Spotify's core"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
log = "0.4"
prost = "0.14"

[build-dependencies]
prost-build = "0.14"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
