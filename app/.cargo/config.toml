# whisper.cpp (lyric generation) is built by CMake inside whisper-rs-sys; these reach it as -D flags, since that
# build script forwards every CMAKE_* variable. The NDK itself is found through ANDROID_NDK_ROOT.
[env]
CMAKE_ANDROID_ARCH_ABI = "arm64-v8a"
CMAKE_SYSTEM_VERSION = "29"
CMAKE_ANDROID_STL_TYPE = "c++_static"
CMAKE_MAKE_PROGRAM = "/usr/bin/make"
CMAKE_PROJECT_INCLUDE = { value = "cmake/whisper-android.cmake", relative = true }
WHISPER_DONT_GENERATE_BINDINGS = "1"
