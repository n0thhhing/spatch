syntax = "proto3";

// Rebuilt from Spotify's generated classes by scripts/port/protos.py; enums are int32.
package com.spotify.cosmos.util.policy.proto;

message AlbumCollectionDecorationPolicy {
}

message AlbumDecorationPolicy {
  bool link = 1;
  bool name = 2;
  bool covers = 4;
  bool year = 5;
}

message AlbumSyncDecorationPolicy {
  bool inferred_offline = 1;
  bool offline_state = 2;
  bool sync_progress = 3;
}

message ArtistCollectionDecorationPolicy {
  bool collection_link = 1;
  bool is_followed = 2;
