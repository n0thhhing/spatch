syntax = "proto3";

// Rebuilt from Spotify's generated classes by scripts/port/protos.py; enums are int32.
package spotify.your_library.proto;

message NumberOfItemsForLinkType {
  int32 link_type = 1;
  int32 num_items = 2;
}

message SetFilterOrderRequest {
  repeated string filter_uri = 1;
}

message SetFilterOrderResponse {
  uint32 status_code = 98;
  string error = 99;
}

message YourLibraryAlbumExtraInfo {
  string artist_name = 1;
  string artist_uri = 2;
  int32 type = 3;
  bool is_premium_only = 4;
  bool new_release = 5;
  int64 release_date = 6;
}

message YourLibraryArtistExtraInfo {
  bool has_liked_tracks_or_albums = 1;
  uint32 track_count = 2;
  uint32 releases_count = 3;
}

message YourLibraryAuthorExtraInfo {
}

message YourLibraryBookExtraInfo {
  string author_name = 1;
  int32 access = 2;
  int64 milliseconds_left = 3;
  int32 percent_done = 4;
  int32 state = 5;
}

message YourLibraryConcertCampaignExtraInfo {
  int32 status = 1;
  int64 start_time = 2;
  int64 end_time = 3;
}

message YourLibraryDecoratedEntity {
  YourLibraryEntityInfo entity_info = 1;
  oneof entity {
    YourLibraryAlbumExtraInfo album = 2;
    YourLibraryArtistExtraInfo artist = 3;
    YourLibraryPlaylistExtraInfo playlist = 4;
    YourLibraryShowExtraInfo show = 5;
    YourLibraryFolderExtraInfo folder = 6;
    YourLibraryNewEpisodesExtraInfo new_episodes = 10;
    YourLibraryBookExtraInfo book = 12;
    YourLibraryPreReleaseExtraInfo prerelease = 15;
    YourLibraryEventExtraInfo event = 16;
    YourLibraryAuthorExtraInfo author = 17;
    YourLibraryVenueExtraInfo venue = 19;
    YourLibraryConcertCampaignExtraInfo concert_campaign = 20;
  }
}

message YourLibraryEntityInfo {
  string name = 2;
  string uri = 3;
  string group_label = 5;
  string image_uri = 6;
  bool pinned = 7;
  int32 pinnable = 8;
  int32 offline_availability = 9;
  int64 add_time = 11;
  int64 last_played = 12;
  bool has_curated_items = 13;
}

message YourLibraryEventExtraInfo {
  string location_name = 1;
  int64 start_time = 2;
  string city_name = 3;
}

message YourLibraryFilters {
  repeated int32 filter = 1;
}

message YourLibraryFilters2 {
  repeated YourLibraryFilters2_AvailableFilter available_filter = 1;
}

message YourLibraryFilters2_AvailableFilter {
  string uri = 1;
  oneof kind {
    int32 filter = 2;
    string concept_name = 3;
  }
}

message YourLibraryFolderExtraInfo {
  int32 number_of_playlists = 2;
  int32 number_of_folders = 3;
  string row_id = 4;
  repeated YourLibraryDecoratedEntity entity = 5;
}

message YourLibraryLabelAndImage {
  string label = 1;
  string image = 2;
  bool include_empty = 3;
}

message YourLibraryNewEpisodesExtraInfo {
  int64 publish_date = 1;
}

message YourLibraryPlaylistExtraInfo {
  string creator_name = 1;
  bool is_loading = 5;
  bool can_view = 6;
  string row_id = 7;
  string creator_uri = 8;
  bool can_add = 9;
  string made_for_name = 10;
  string made_for_uri = 11;
  repeated NumberOfItemsForLinkType number_of_items_per_link_type = 12;
  bool owned_by_self = 13;
  YourLibraryPlaylistFolderInfo from_folder = 14;
  string name_prefix = 15;
  bool mixing_active = 16;
  bool is_empty_predefined = 17;
  int32 prompt_generation_status = 18;
  bool prompt_is_personalized = 19;
  bool is_prompt_playlist = 20;
  bool is_published = 21;
  bool is_private = 22;
}

message YourLibraryPlaylistFolderInfo {
  string uri = 1;
  string name = 2;
}

message YourLibraryPreReleaseExtraInfo {
  string artist_name = 1;
  string artist_uri = 2;
  int32 type = 3;
  int32 album_type = 4;
}

message YourLibraryPredefinedPlaylistConfig {
  int32 inclusion_mode = 1;
  bool decorate_num_link_types = 2;
}

message YourLibraryPredefinedPlaylistConfigs {
  YourLibraryPredefinedPlaylistConfig liked_songs = 1;
  YourLibraryPredefinedPlaylistConfig your_episodes = 2;
  YourLibraryLabelAndImage new_episodes = 3;
  YourLibraryPredefinedPlaylistConfig cached_files = 5;
  YourLibraryPredefinedPlaylistConfig highlights = 6;
  YourLibraryPredefinedPlaylistConfig kallax = 7;
  YourLibraryPredefinedPlaylistConfig local_files = 8;
  bool all_available_configs_provided = 99;
}

message YourLibraryShowExtraInfo {
  string creator_name = 1;
  int64 publish_date = 4;
  int32 number_of_downloaded_episodes = 6;
}

message YourLibrarySortOrder {
  int32 sort_order = 1;
  bool reverse = 2;
}

message YourLibraryVenueExtraInfo {
  string address_name = 1;
  string city_name = 2;
}
