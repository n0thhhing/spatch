syntax = "proto3";

// Fields used by Spatch, verified against Spotify 9.2.0.26 searchview/v3/search.
package com.spotify.searchview.proto;
import "com.google.protobuf.proto";

message MainViewResponse {
  repeated Entity hits = 1;
  string next_page_token = 4;
}
message Entity {
  string uri = 1;
  string name = 2;
  string image_uri = 3;
  oneof entity {
    Artist artist = 4;
    Track track = 5;
    Album album = 6;
    Playlist playlist = 7;
    AudioShow audio_show = 9;
    AudioEpisode audio_episode = 10;
    Section section = 14;
  }
}
message Artist {}
message Track {
  repeated RelatedEntity track_artists = 4;
  .com.google.protobuf.Duration duration = 18;
}
message Album { repeated string artist_names = 1; }
message Playlist { string owner_name = 5; }
message AudioShow { string publisher_name = 1; }
message AudioEpisode {
  string show_name = 1;
  .com.google.protobuf.Duration duration = 3;
}
message RelatedEntity { string name = 2; }
message Section { repeated SectionItem items = 2; }
message SectionItem {
  oneof item { GenericItem generic_item = 2; }
}
message GenericItem { Entity entity = 1; }
