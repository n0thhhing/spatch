<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changelog · Spatch</title>
<meta name="description" content="Spatch and Spatch Manager releases.">
<meta name="theme-color" content="#141218">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..500,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>document.documentElement.classList.add("js")</script>
</head>
<body>
<main>
<div class="wrap page-head"><p class="eyebrow">Changelog</p><h1>What's new</h1><p class="lead">Patches and manager releases, straight from GitHub.</p><div class="filters"><button class="chip on" data-k="all">All</button><button class="chip" data-k="patches">Patches</button><button class="chip" data-k="manager">Manager</button></div></div>
<section style="padding-top:8px"><div class="wrap" style="max-width:860px" id="releases"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></section>
</main>
<script src="assets/site.js"></script>
<script>
(function(){
  var box=document.getElementById("releases"), list=[];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function show(k){box.innerHTML=list.filter(function(r){return k==="all"||r.kind===k}).map(function(r){
    return '<article class="release"><header><h3>'+esc(r.name)+'</h3><span class="kind '+r.kind+'">'+(r.kind==="manager"?"Manager":"Patches")+'</span><time>'+new Date(r.date).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})+'</time></header><p>'+esc(r.body||"")+'</p><a class="btn text" href="'+r.url+'"><span class="ms">open_in_new</span>Release page</a></article>'}).join("")||'<p class="muted">No releases yet.</p>'}
  fetch("https://api.github.com/repos/n0thhhing/spatch/releases?per_page=50").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rs){
    list=rs.filter(function(r){return!r.draft}).map(function(r){return{name:r.name||r.tag_name,body:r.body,date:r.published_at,url:r.html_url,kind:/^manager-/.test(r.tag_name)?"manager":"patches"}});show("all")
  }).catch(function(){box.innerHTML='<p class="muted">Couldn\'t load releases. <a href="https://github.com/n0thhhing/spatch/releases">See them on GitHub</a>.</p>'});
  document.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){document.querySelectorAll("[data-k]").forEach(function(x){x.classList.toggle("on",x===b)});show(b.dataset.k)}})
})();
</script>
</body>
</html>
