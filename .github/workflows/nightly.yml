# Publishes nightly patches when patch sources change. The Spotify APKM comes from the
# private Spatch source, with its own invite in the SOURCE_INVITE secret (made with
# source/cloudflare/add-friend.sh nightly-ci; revoke with `npx wrangler secret delete CODE_nightly-ci`).
# Patches and Manager build independently before the publish job.
name: nightly

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
    paths:
      - "crates/**"
      - "android/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/nightly.sh"
      - ".github/workflows/nightly.yml"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref_name }}
  cancel-in-progress: true # a newer push to the same branch makes the running build moot

# main publishes `nightly`; any other branch its own `branch-<name>` prerelease, which the manager's Branch picker installs.
env:
  NIGHTLY_TAG: ${{ github.ref_name == 'main' && 'nightly' || format('branch-{0}', github.ref_name) }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      patches: ${{ steps.inputs.outputs.patches }}
    steps:
      - uses: actions/checkout@v4
      - id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_CHECK: 1
        run: tools/nightly.sh "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.patches == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.spatch/nightly-target
          key: ${{ runner.os }}-nightly-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'crates/**', 'android/**') }}
          restore-keys: |
            ${{ runner.os }}-nightly-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-nightly-
            nightly-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/spatch/diffs-v1
          key: ${{ runner.os }}-spatch-diffs-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-spatch-diffs-v1-
      - uses: actions/cache@v4
        with:
          path: ~/bin/apktool.jar
          key: ${{ runner.os }}-apktool-3.0.3
      - uses: actions/cache@v4
        with:
          path: ~/.cache/spatch/build-v1
          key: ${{ runner.os }}-spatch-build-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-spatch-build-v1-
      - name: Android build-tools and apktool
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" > /dev/null
          fi
          if ! ls "$ANDROID_HOME"/platforms/android-*/android.jar >/dev/null 2>&1; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" > /dev/null
          fi
          mkdir -p "$HOME/bin"
          if [ ! -s "$HOME/bin/apktool.jar" ]; then
            curl -fsSL -o "$HOME/bin/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          fi
          printf '#!/bin/sh\nexec java -jar "%s/bin/apktool.jar" "$@"\n' "$HOME" > "$HOME/bin/apktool"
          chmod +x "$HOME/bin/apktool"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        if: hashFiles('crates/core/Cargo.toml') != ''
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            target
          key: ${{ runner.os }}-spatch-app-${{ hashFiles('Cargo.lock', 'crates/core/Cargo.toml') }}-${{ hashFiles('crates/core/src/**', 'crates/core/proto/**', 'crates/core/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-spatch-app-${{ hashFiles('Cargo.lock', 'crates/core/Cargo.toml') }}-
            ${{ runner.os }}-spatch-app-
      - name: Rust app library
        if: hashFiles('crates/core/Cargo.toml') != ''
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq protobuf-compiler > /dev/null
          rustup target add aarch64-linux-android
          command -v cargo-ndk > /dev/null || cargo install cargo-ndk --locked --version 4.1.2
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" cargo ndk -t arm64-v8a -P 29 build --release --locked -p spatch_app
          echo "SPATCH_APP_SO=$PWD/target/aarch64-linux-android/release/libspatch_app.so" >> "$GITHUB_ENV"
      - name: Spotify APKM from the private source
        env:
          INVITE: ${{ secrets.SOURCE_INVITE }}
        run: |
          version=$(sed -n 's/^pub const VERSION_NAME: &str = "\(.*\)";/\1/p' crates/patcher/src/input.rs)
          index=${INVITE%%#*} login=${INVITE#*#}
          auth="${login%%.*}:${login#*.}"
          curl -fsS -u "$auth" "$index" > "$RUNNER_TEMP/index.json"
          entry=$(jq -c --arg v "$version" '.sources[] | select(.versionName == $v)' "$RUNNER_TEMP/index.json")
          [ -n "$entry" ] || { echo "the source has no Spotify $version"; exit 1; }
          apkm="$RUNNER_TEMP/spotify-$version.apkm"
          # curl sends the login to the source only, not to the GitHub link it redirects to
          curl -fsSL -u "$auth" -o "$apkm" "${index%/*}/$(echo "$entry" | jq -r '.urls[0]')"
          echo "$(echo "$entry" | jq -r .sha256)  $apkm" | sha256sum -c -
          echo "SPATCH_APKM=$apkm" >> "$GITHUB_ENV"
      - name: Build the patch bundle
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_BUILD: normal
          NIGHTLY_OUT: ${{ runner.temp }}/bundle
        run: |
          tools/nightly.sh "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: ${{ runner.temp }}/bundle
          if-no-files-found: ignore # nightly was already this commit
          retention-days: 1
          compression-level: 0 # the bundle is already compressed

  publish:
    needs: [changes, build]
    if: always() && needs.changes.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && needs.changes.outputs.patches == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the nightly tag and release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/bundles
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_BUNDLES: ${{ runner.temp }}/bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tools/nightly.sh "$GITHUB_SHA"
