# Publishes nightly patches when patch sources change. The Spotify APKM comes from the
# private Spatch source, with its own invite in the SOURCE_INVITE secret (made with
# source/cloudflare/add-friend.sh nightly-ci; revoke with `npx wrangler secret delete CODE_nightly-ci`).
# The two bundles build side by side on their own runners; a last job publishes both.
name: nightly

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
    paths:
      - "src/**"
      - "theme/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/nightly.sh"
      - "scripts/port/aliases.tsv"
      - ".github/workflows/nightly.yml"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true # a newer push makes the running build moot

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        bundle: [normal, debug]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.spatch/nightly-target
          key: ${{ runner.os }}-nightly-${{ matrix.bundle }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'src/**', 'theme/**', 'scripts/port/aliases.tsv') }}
          restore-keys: |
            ${{ runner.os }}-nightly-${{ matrix.bundle }}-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-nightly-${{ matrix.bundle }}-
            nightly-${{ matrix.bundle }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/spatch/diffs-v1
          key: ${{ runner.os }}-spatch-diffs-v1-${{ github.sha }}-${{ matrix.bundle }}
          restore-keys: |
            ${{ runner.os }}-spatch-diffs-v1-
      - uses: actions/cache@v4
        with:
          path: ~/bin/apktool.jar
          key: ${{ runner.os }}-apktool-3.0.3
      - name: Android build-tools and apktool
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" > /dev/null
          fi
          mkdir -p "$HOME/bin"
          if [ ! -s "$HOME/bin/apktool.jar" ]; then
            curl -fsSL -o "$HOME/bin/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          fi
          printf '#!/bin/sh\nexec java -jar "%s/bin/apktool.jar" "$@"\n' "$HOME" > "$HOME/bin/apktool"
          chmod +x "$HOME/bin/apktool"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Spotify APKM from the private source
        env:
          INVITE: ${{ secrets.SOURCE_INVITE }}
        run: |
          version=$(sed -n 's/^pub const VERSION_NAME: &str = "\(.*\)";/\1/p' src/input.rs)
          index=${INVITE%%#*} login=${INVITE#*#}
          auth="${login%%.*}:${login#*.}"
          curl -fsS -u "$auth" "$index" > "$RUNNER_TEMP/index.json"
          entry=$(jq -c --arg v "$version" '.sources[] | select(.versionName == $v)' "$RUNNER_TEMP/index.json")
          [ -n "$entry" ] || { echo "the source has no Spotify $version"; exit 1; }
          apkm="$RUNNER_TEMP/spotify-$version.apkm"
          # curl sends the login to the source only, not to the GitHub link it redirects to
          curl -fsSL -u "$auth" -o "$apkm" "${index%/*}/$(echo "$entry" | jq -r '.urls[0]')"
          echo "$(echo "$entry" | jq -r .sha256)  $apkm" | sha256sum -c -
          echo "SPATCH_APKM=$apkm" >> "$GITHUB_ENV"
      - name: Build the ${{ matrix.bundle }} bundle
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_BUILD: ${{ matrix.bundle }}
          NIGHTLY_OUT: ${{ runner.temp }}/bundle
        run: scripts/nightly.sh "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.bundle }}
          path: ${{ runner.temp }}/bundle
          if-no-files-found: ignore # nightly was already this commit
          retention-days: 1
          compression-level: 0 # the bundles are already compressed ZIPs

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the nightly tag and release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/bundles
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_BUNDLES: ${{ runner.temp }}/bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/nightly.sh "$GITHUB_SHA"
