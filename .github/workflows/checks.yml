name: checks

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          rustup component add clippy
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
      - name: Check the patcher
        run: |
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
      - name: Check the app and preview
        working-directory: app
        run: |
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --features preview --locked
          cargo clippy --all-targets --features preview --locked -- -D warnings
      - name: Check nightly input selection
        run: python3 tests/nightly-inputs.py
      - name: Check catalog request contract
        run: python3 tests/catalog-request.py
