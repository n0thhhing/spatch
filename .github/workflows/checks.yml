name: checks

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          rustup component add clippy
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
      - name: Check the patcher
        run: |
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
      - name: Check the app and preview
        working-directory: app
        run: |
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --features preview --locked
          cargo clippy --all-targets --features preview --locked -- -D warnings
      - name: Check nightly input selection
        run: python3 tests/nightly-inputs.py
      - name: Check catalog request contract
        run: python3 tests/catalog-request.py

  mac-preview:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: app/preview/desktop/**/*.gradle
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.m2/repository/org/robolectric
            app/target/mac-preview
          key: mac-preview-${{ runner.arch }}-${{ hashFiles('app/Cargo.lock', 'app/preview/desktop/build.gradle') }}-${{ hashFiles('app/src/**', 'app/proto/**') }}
          restore-keys: mac-preview-${{ runner.arch }}-${{ hashFiles('app/Cargo.lock', 'app/preview/desktop/build.gradle') }}-
      - name: Install protobuf compiler
        run: command -v protoc || brew install protobuf
      - name: Render the shared Android UI on Mac
        run: app/preview/mac.sh --check
      - uses: actions/upload-artifact@v4
        with:
          name: mac-preview-screenshot
          path: app/preview/desktop/build/reports/preview/*.png
